<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520">
<style>text{font-family:Arial,sans-serif;fill:#243447} .small{font-size:12px} .title{font-size:20px;font-weight:bold}</style>
<text x="90" y="30" class="title">Geomean IPC speedup versus NoPrefetch</text>
<text x="15" y="232.5" transform="rotate(-90 15 232.5)" class="small">speedup (x)</text>
