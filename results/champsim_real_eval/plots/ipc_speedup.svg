<rect x="117.4" y="400.0" width="141.1" height="1.0" fill="#2f80ed"/>
<text x="188.0" y="395.0" text-anchor="middle" class="small">1.000</text>
<text x="188.0" y="455" transform="rotate(-45 188.0 455)" text-anchor="end" class="small">NoPrefetch</text>
<rect x="313.4" y="65.0" width="141.1" height="335.0" fill="#2f80ed"/>
<text x="384.0" y="60.0" text-anchor="middle" class="small">1.120</text>
<text x="384.0" y="455" transform="rotate(-45 384.0 455)" text-anchor="end" class="small">NativeSPP</text>
